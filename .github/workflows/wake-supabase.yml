name: Wake Supabase Daily

on:
  schedule:
    # 09:17 UTC todos os dias (1x por dia)
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing secret: SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PING_PATH: ${{ secrets.SUPABASE_PING_PATH }}
        run: |
          set -e

          base_url="${SUPABASE_URL%/}"
          ping_path="${SUPABASE_PING_PATH:-/rest/v1/filaments?select=id&limit=1}"
          endpoint="${base_url}${ping_path}"

          echo "Pinging: ${endpoint}"

          http_code=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "${endpoint}")

          echo "HTTP ${http_code}"
          head -c 400 response.json || true
          echo

          # 000: erro de rede/curl, 5xx: erro do servidor
          if [ "$http_code" = "000" ]; then
            echo "Network error while pinging Supabase"
            exit 1
          fi
          if [ "$http_code" -ge 500 ]; then
            echo "Supabase returned server error"
            exit 1
          fi

          echo "Wake ping executed successfully"
